<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #333; }
    .subtitle { font-size: 11px; fill: #666; }
    .comp { font-size: 10px; font-weight: bold; fill: #fff; }
    .comp-desc { font-size: 8.5px; fill: rgba(255,255,255,.8); }
    .section-label { font-size: 11px; font-weight: bold; fill: #1168bd; }
    .arrow-label { font-size: 8px; fill: #555; }
  </style>
  <text x="450" y="28" text-anchor="middle" class="title">C4 Level 3 — Component: PHP Application</text>
  <text x="450" y="46" text-anchor="middle" class="subtitle">Componentele interne ale serverului PHP</text>

  <!-- Controllers section -->
  <rect x="30" y="65" width="380" height="250" rx="6" fill="none" stroke="#1168bd" stroke-dasharray="5,3"/>
  <text x="45" y="82" class="section-label">Controllers</text>

  <rect x="45" y="92" width="165" height="40" rx="4" fill="#1168bd"/>
  <text x="128" y="110" text-anchor="middle" class="comp">AuthController</text>
  <text x="128" y="122" text-anchor="middle" class="comp-desc">Login, logout, auth_require</text>

  <rect x="225" y="92" width="170" height="40" rx="4" fill="#1168bd"/>
  <text x="310" y="110" text-anchor="middle" class="comp">EventsController</text>
  <text x="310" y="122" text-anchor="middle" class="comp-desc">CRUD crize + CAP trigger</text>

  <rect x="45" y="145" width="165" height="40" rx="4" fill="#1168bd"/>
  <text x="128" y="163" text-anchor="middle" class="comp">SheltersController</text>
  <text x="128" y="175" text-anchor="middle" class="comp-desc">CRUD adaposturi</text>

  <rect x="225" y="145" width="170" height="40" rx="4" fill="#1168bd"/>
  <text x="310" y="163" text-anchor="middle" class="comp">AlertsController</text>
  <text x="310" y="175" text-anchor="middle" class="comp-desc">Servire JSON + XML CAP</text>

  <rect x="45" y="198" width="165" height="40" rx="4" fill="#1168bd"/>
  <text x="128" y="216" text-anchor="middle" class="comp">ExportController</text>
  <text x="128" y="228" text-anchor="middle" class="comp-desc">CSV, JSON, XML export</text>

  <rect x="225" y="198" width="170" height="40" rx="4" fill="#1168bd"/>
  <text x="310" y="216" text-anchor="middle" class="comp">ImportController</text>
  <text x="310" y="228" text-anchor="middle" class="comp-desc">CSV, JSON upload</text>

  <rect x="130" y="253" width="175" height="40" rx="4" fill="#1168bd"/>
  <text x="218" y="271" text-anchor="middle" class="comp">EarthquakesController</text>
  <text x="218" y="283" text-anchor="middle" class="comp-desc">Date seismice Kaggle</text>

  <!-- Models section -->
  <rect x="30" y="330" width="380" height="250" rx="6" fill="none" stroke="#2b78c2" stroke-dasharray="5,3"/>
  <text x="45" y="347" class="section-label">Models</text>

  <rect x="45" y="358" width="160" height="36" rx="4" fill="#2b78c2"/>
  <text x="125" y="376" text-anchor="middle" class="comp">UsersModel</text>
  <text x="125" y="386" text-anchor="middle" class="comp-desc">CRUD users, bcrypt</text>

  <rect x="225" y="358" width="170" height="36" rx="4" fill="#2b78c2"/>
  <text x="310" y="376" text-anchor="middle" class="comp">EventsModel</text>
  <text x="310" y="386" text-anchor="middle" class="comp-desc">CRUD events + validare</text>

  <rect x="45" y="405" width="160" height="36" rx="4" fill="#2b78c2"/>
  <text x="125" y="423" text-anchor="middle" class="comp">SheltersModel</text>
  <text x="125" y="433" text-anchor="middle" class="comp-desc">CRUD adaposturi</text>

  <rect x="225" y="405" width="170" height="36" rx="4" fill="#2b78c2"/>
  <text x="310" y="423" text-anchor="middle" class="comp">AlertsModel</text>
  <text x="310" y="433" text-anchor="middle" class="comp-desc">CRUD alerte CAP</text>

  <rect x="45" y="452" width="160" height="36" rx="4" fill="#2b78c2"/>
  <text x="125" y="470" text-anchor="middle" class="comp">EarthquakesModel</text>
  <text x="125" y="480" text-anchor="middle" class="comp-desc">Query + paginare</text>

  <rect x="225" y="452" width="170" height="36" rx="4" fill="#d4451a"/>
  <text x="310" y="470" text-anchor="middle" class="comp">CAPGenerator</text>
  <text x="310" y="480" text-anchor="middle" class="comp-desc">XML CAP v1.2 DOMDocument</text>

  <rect x="130" y="500" width="175" height="36" rx="4" fill="#d4451a"/>
  <text x="218" y="518" text-anchor="middle" class="comp">RouteCalculator</text>
  <text x="218" y="528" text-anchor="middle" class="comp-desc">Haversine + OSRM cURL</text>

  <!-- Client-side section -->
  <rect x="480" y="65" width="390" height="250" rx="6" fill="none" stroke="#438dd5" stroke-dasharray="5,3"/>
  <text x="495" y="82" class="section-label">Client (Browser)</text>

  <rect x="495" y="92" width="170" height="40" rx="4" fill="#438dd5"/>
  <text x="580" y="110" text-anchor="middle" class="comp">ajax.js</text>
  <text x="580" y="122" text-anchor="middle" class="comp-desc">apiGet/Post/Put/Delete (fetch)</text>

  <rect x="685" y="92" width="170" height="40" rx="4" fill="#438dd5"/>
  <text x="770" y="110" text-anchor="middle" class="comp">map.js</text>
  <text x="770" y="122" text-anchor="middle" class="comp-desc">Leaflet layers, filtre, geolocatie</text>

  <rect x="495" y="145" width="170" height="40" rx="4" fill="#438dd5"/>
  <text x="580" y="163" text-anchor="middle" class="comp">admin.js</text>
  <text x="580" y="175" text-anchor="middle" class="comp-desc">CRUD modale, import/export</text>

  <rect x="685" y="145" width="170" height="40" rx="4" fill="#438dd5"/>
  <text x="770" y="163" text-anchor="middle" class="comp">alerts-public.js</text>
  <text x="770" y="175" text-anchor="middle" class="comp-desc">Carduri alerte publice</text>

  <!-- Views section -->
  <rect x="480" y="210" width="390" height="90" rx="4" fill="none" stroke="#438dd5" stroke-dasharray="5,3"/>
  <text x="495" y="227" class="section-label">Views (Templates PHP)</text>

  <rect x="495" y="235" width="100" height="30" rx="3" fill="#438dd5"/>
  <text x="545" y="254" text-anchor="middle" class="comp">header.php</text>
  <rect x="605" y="235" width="90" height="30" rx="3" fill="#438dd5"/>
  <text x="650" y="254" text-anchor="middle" class="comp">footer.php</text>
  <rect x="705" y="235" width="150" height="30" rx="3" fill="#438dd5"/>
  <text x="780" y="254" text-anchor="middle" class="comp">*View.php (6 views)</text>

  <!-- Database -->
  <rect x="530" y="380" width="300" height="80" rx="6" fill="#999"/>
  <text x="680" y="410" text-anchor="middle" class="comp" style="font-size:12px">MariaDB</text>
  <text x="680" y="428" text-anchor="middle" class="comp-desc" style="font-size:10px">7 tabele: disaster_types, users, events,</text>
  <text x="680" y="443" text-anchor="middle" class="comp-desc" style="font-size:10px">shelters, alerts, earthquakes, evacuation_routes</text>

  <!-- Arrows -->
  <line x1="220" y1="315" x2="220" y2="330" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="410" y1="450" x2="530" y2="420" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>
  <text x="460" y="428" class="arrow-label">Prepared Stmts</text>

  <line x1="480" y1="160" x2="410" y2="160" stroke="#555" stroke-width="1" marker-end="url(#ar)"/>
  <text x="440" y="153" class="arrow-label">JSON/REST</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
</svg>
